services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: legis_poc
      POSTGRES_USER: legis
      POSTGRES_PASSWORD: legis
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legis -d legis_poc"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: legis_poc
      POSTGRES_USER: legis
      POSTGRES_PASSWORD: legis
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      MOCK_AUTH_ENABLED: "1"
      MOCK_AUTH_TOKEN: poc-demo-token
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "9000:80"
    depends_on:
      - backend

volumes:
  pgdata:
